plugins { id 'com.android.application' }

android {
  namespace 'ph.egov.ssotest'
  compileSdk 35
  defaultConfig {
    applicationId 'ph.egov.ssotest'
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName '1.0'
    buildConfigField 'String', 'SSO_CHECKER_URL', '"' + (project.findProperty('ssoCheckerUrl') ?: '') + '"'
  }
  buildFeatures { buildConfig true }
}
