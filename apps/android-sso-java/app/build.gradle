plugins { id "com.android.application" }

def ssoClientId = providers.gradleProperty("ssoClientId")
  .orElse(providers.environmentVariable("EGOV_SSO_CLIENT_ID"))
  .orElse(providers.environmentVariable("EGOV_SSO_PARTNER_CODE"))
  .getOrElse("")
def ssoApiBaseUrl = providers.gradleProperty("ssoApiBaseUrl")
  .orElse(providers.environmentVariable("EGOV_SSO_API_BASE_URL"))
  .getOrElse("")

def javaString = { value ->
  '"' + value.replace("\\", "\\\\").replace('"', '\\"') + '"'
}

android {
  namespace "ph.egov.ssotest"
  compileSdk 35

  defaultConfig {
    applicationId "ph.egov.ssotest"
    minSdk 26
    targetSdk 35
    versionCode 1
    versionName "1.0"
    buildConfigField "String", "EGOV_SSO_CLIENT_ID", javaString(ssoClientId)
    buildConfigField "String", "EGOV_SSO_API_BASE_URL", javaString(ssoApiBaseUrl)
  }

  buildFeatures { buildConfig true }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

tasks.withType(JavaCompile).configureEach {
  options.compilerArgs += ["-Xlint:deprecation"]
}
